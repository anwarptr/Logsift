name: Publish logsifter to npm

# Started by hand (Actions → "Publish logsifter to npm" → Run workflow), from a computer or the GitHub
# mobile app. It checks, tests and builds everything first, then publishes cli/ as "logsifter" with
# the version in package.json. Needs the repository secret NPM_TOKEN (an npm access token).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    name: Test, build and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance: shows on npmjs.com that this build came from this repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:cli
      - name: Stop if this version is already on npm
        working-directory: cli
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "logsifter@$version" version >/dev/null 2>&1; then
            echo "::error::logsifter@$version is already on npm. Raise the version in package.json first."
            exit 1
          fi
      - name: Publish
        working-directory: cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Check it is on npm
        working-directory: cli
        run: |
          version=$(node -p "require('./package.json').version")
          for i in 1 2 3 4 5 6; do npm view "logsifter@$version" version && exit 0; sleep 10; done
          echo "::warning::Published, but npm doesn't list it yet; check https://www.npmjs.com/package/logsifter in a minute."
